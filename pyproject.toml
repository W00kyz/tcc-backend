[project]
name = "tcc-backend"
version = "0.1.0"
description = "API do sistema de monitoramento de rotas da Prefeitura Universitária da UFCG"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "pyjwt==2.13.0",
    "aiosmtplib==5.1.2",
    "cryptography==50.0.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "httpx2==2.12.0",
    "pre-commit==4.6.2",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["uv_build==0.11.25"]  # casa com o uv 0.11.25 do .mise.toml e do CI
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "PT", "A"]

[tool.ruff.lint.per-file-ignores]
# Testes não precisam de anotação de retorno em cada caso.
"tests/**" = ["ANN201"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=70"
